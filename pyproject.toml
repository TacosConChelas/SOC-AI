[project]
name = "soc-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9"]

[project.optional-dependencies]
agent = [
    "langgraph",
    "langchain",
    "redis>=8",
    "opensearch-py",
    "httpx",
    "psycopg",
    "prometheus-client>=0.21",
]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "fakeredis[lua]>=2.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]
# UP042 = StrEnum enforcement

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
markers = ["integration: requires live Redis/OpenSearch/Postgres stack"]
